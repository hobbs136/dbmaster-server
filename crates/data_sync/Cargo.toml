[package]
name = "dbmaster-data-sync"
version.workspace = true
edition.workspace = true
description = "DbMaster Server data-sync engine — time-batched JOIN-based ETL with cron scheduling"
license.workspace = true
repository.workspace = true

[dependencies]
# CHANGE: data-sync 一期 — depends on core (AppState/Config/DataSyncRunner trait)
# and automation (credential decrypt + gate_blocked) so the runner can resolve
# stored source/target connections and assemble a JOINed batch INSERT.
dbmaster-core = { path = "../core" }
dbmaster-automation = { path = "../automation" }
dbmaster-license = { path = "../license" }
# sqlx opens customer source/target pools (mysql+postgres pure-Rust drivers)
# and writes progress/cursor rows to the local SQLite control DB.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "postgres"] }
# cron expression parsing for the scheduler (replaces the interval_minutes
# model used by drift; scheduled_tasks.cron_expr is now consumed here).
cron = "0.12"
# impl dbmaster_core::server::DataSyncRunner for the manual-run bridge.
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
anyhow = "1"
thiserror = "1"
# CHANGE: 三期 — ClickHouse HTTP 写入（JSONEachRow 批量 INSERT）。
# rustls-tls 避免 OpenSSL 链接；json 用于 error response 解析（非必需但方便）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Basic auth header 编码（ClickHouseClient 用户名/密码）。
base64 = "0.22"
